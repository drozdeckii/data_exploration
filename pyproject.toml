[project]
name = "dataexpo"
version = "0.1.0"
description = "Data analyst practice sandbox: Postgres + ClickHouse + Python + R"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.8.10",
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scipy>=1.16.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.52",
    "statsmodels>=0.14.4",
]

[project.scripts]
dataexpo = "dataexpo:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]

[tool.uv.build-backend]
module-root = ""
